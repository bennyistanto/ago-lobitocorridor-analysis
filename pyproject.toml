[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "ago-lobitocorridor-analysis"
description = "Spatial analysis pipeline for prioritizing infrastructure investments along Angola's Lobito Corridor"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = ["angola", "lobito-corridor", "geospatial", "infrastructure", "world-bank"]
authors = [{ name = "Benny Istanto", email = "bistanto@worldbank.org" }]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3 :: Only",
	"License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

requires-python = ">=3.10"
dependencies = [
	"bokeh>=3,<4",
	"requests>=2.28.1",
	"pandas>=2",
	"pycountry>=22.3.5",
	"matplotlib>=3.7,<4",
    "rasterio>=1.3.9,<1.4",
    "xarray>=2023.1.0",
    "rioxarray>=0.15.0",
    "geopandas>=0.14,<1.1",
]
[project.optional-dependencies]
docs = [
	"docutils>=0.17,<0.22",  # relaxed from ==0.17.1; jupyter-book >=1.0.3 works with newer docutils
	"jupyter-book>=1.0.3,<2",
	"sphinxcontrib-mermaid>=0.7,<1.0",
]
test = [
	"pytest>=7",
]

[project.urls]
"Homepage" = "https://github.com/bennyistanto/ago-lobitocorridor-analysis"
"Bug Reports" = "https://github.com/bennyistanto/ago-lobitocorridor-analysis/issues"
"Source" = "https://github.com/bennyistanto/ago-lobitocorridor-analysis"

[project.scripts]
lobito-run = "src.run:main"

[tool.codespell]
skip = 'docs/_build,docs/bibliography.bib,*.png,*.gz,*.whl'
ignore-regex = '^\s*"image\/png":\s.*'
ignore-words-list = "gost,Nd"

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*"
]

[tool.hatch.build.targets.wheel]
include = [
    "src/**/*"
]

[tool.hatch.version]
source = "vcs"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]